    <ellipse cx="342" cy="215" rx="78" ry="44" transform="rotate(32 342 215)" fill="url(#wing)"/>
    <ellipse cx="185" cy="292" rx="52" ry="30" transform="rotate(28 185 292)" fill="url(#wing)"/>
